on:
  push:
    branches:
      - dev
    paths-ignore:
      - '**/README.md'
  pull_request:
    branches:
      - dev

permissions:
  contents: read

env:
  JAVA_VERSION: "21.x"
  FLUTTER_VERSION: "3.29.0"

jobs:
  analyze:
    name: Analyze Flutter 🔍
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java ☕
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter 🐦
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Analyze solved.ac API  🔍
        run: |
          ls
          cd packages/apis/solved_api
          flutter pub get
          flutter analyze

      - name: Analyze BOJ API  🔍
        run: |
          cd packages/apis/boj_api
          flutter pub get
          flutter analyze

      - name: Analyze Notification API  🔍
        run: |
          cd packages/apis/notification_api
          flutter pub get
          flutter analyze

      - name: Analyze Shared Preferences API  🔍
        run: |
          cd packages/apis/shared_preferences_api
          flutter pub get
          flutter analyze

      - name: Analyze User Repository  🔍
        run: |
          cd packages/repositories/user_repository
          flutter pub get
          flutter analyze

      - name: Analyze Search Repository  🔍
        run: |
          cd packages/repositories/search_repository
          flutter pub get
          flutter analyze

      - name: Analyze Contest Repository  🔍
        run: |
          cd packages/repositories/contest_repository
          flutter pub get
          flutter analyze

      - name: Analyze Contest Notification Repository  🔍
        run: |
          cd packages/repositories/contest_notification_repository
          flutter pub get
          flutter analyze

      - name: Analyze Shared Preferences Repository  🔍
        run: |
          cd packages/repositories/shared_preferences_repository
          flutter pub get
          flutter analyze

      - name: Analyze Streak Notification Repository  🔍
        run: |
          cd packages/repositories/streak_notification_repository
          flutter pub get
          flutter analyze

      - name: Analyze My.solved  🔍
        run: |
          flutter pub get
          flutter analyze

  test:
    name: Test API & Repository 🛰️
    runs-on: ubuntu-latest
    needs: [ analyze ]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java ☕
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}
      - name: Setup Flutter 🐦
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Test solved.ac API  🛰️
        run: |
          cd packages/apis/solved_api
          flutter test

      - name: Test BOJ API  🛰️
        run: |
          cd packages/apis/boj_api
          flutter test

      - name: Test User Repository  🛰️
        run: |
          cd packages/repositories/user_repository
          flutter test

      - name: Test Search Repository  🛰️
        run: |
          cd packages/repositories/search_repository
          flutter test

      - name: Test Contest Repository  🛰️
        run: |
          cd packages/repositories/contest_repository
          flutter test

      - name: Test Contest Notification Repository  🛰️
        run: |
          cd packages/repositories/contest_notification_repository
          flutter test

      - name: Test Shared Preferences Repository  🛰️
        run: |
          cd packages/repositories/shared_preferences_repository
          flutter test

      - name: Test My.solved  🛰️
        run: |
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo "No root tests found."
          fi

  build:
    needs: [ test ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    name: Deploy Web 🌐
    runs-on: ubuntu-latest
    env:
      FLUTTER_WEB_RENDERER: html
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java ☕
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter 🐦
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Build Web 🌐
        run: |
          mkdir ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          mkdir -p build/web
          cd build/web
          git init
          git config --global user.name "w8385"
          git config --global user.email "w8385@naver.com"
          git remote add origin git@github.com:My-solved/My-solved.github.io.git
          git pull origin main
          git checkout main
          cd ../../
          flutter pub get
          flutter build web --release
          cd build/web
          git add .
          git commit -m "Update web"
          git push
